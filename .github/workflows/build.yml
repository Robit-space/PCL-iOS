name: PCL-iOS Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# 并发控制：同一分支新的推送会取消旧的构建，避免 runner 资源浪费
concurrency:
  group: pcl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PCL-iOS
    # 对齐 Amethyst：macos-14 + Xcode 15.4（兼容 ldid 2.1.5_1）
    runs-on: macos-14
    
    env:
      APP_NAME: PCL-iOS
      APP_VERSION: "1.0"
      APP_BUNDLE_ID: com.pcl-ios.pcl
    
    steps:
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
      
      # === 工具安装 (对齐 Amethyst CI) ===
      - name: Install build tools (gmake, ldid, java)
        run: |
          echo "=== 安装构建工具 ==="
          brew update || true
          brew install make ldid || true
          
          # 验证工具
          echo "--- 工具版本 ---"
          gmake --version | head -1
          ldid --version || ldid -V || echo "ldid version unknown"
          xcodegen --version || echo "xcodegen not found, will install"
      
      - name: Setup xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      
      - name: Select Xcode 15.4 (参照 Amethyst)
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version || true
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      
      # === JRE 缓存 ===
      # 缓存键使用固定前缀（JRE URL在Makefile中硬编码，变更极少）
      # 需手动递增版本号（jre-cache-v3）来强制刷新缓存
      - name: Cache Java JRE
        id: cache-jre
        uses: actions/cache@v4
        with:
          path: |
            depends/java-8-openjdk
            depends/java-17-openjdk
            depends/java-21-openjdk
            depends/java-25-openjdk
          key: jre-cache-v3
          restore-keys: |
            jre-cache-
      
      - name: Download Java JRE (via Makefile)
        timeout-minutes: 20
        run: |
          echo "=== 准备Java JRE（缓存命中则直接解包，未命中则自动下载） ==="
          gmake jre 2>&1 | tail -20
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: JRE准备失败"
            exit 1
          fi
      
      - name: Verify JRE
        run: gmake verify-jre
      
      # === 构建 ===
      - name: Generate Xcode Project
        run: |
          gmake gen
          # 降级 project 格式以兼容 Xcode 15.4
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' PCL-iOS.xcodeproj/project.pbxproj
          echo "Project format patched for Xcode 15.4 compatibility"
      
      - name: Build App
        timeout-minutes: 10
        run: |
          gmake build RELEASE=0 2>&1 | tail -30
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            exit 1
          fi
      
      # === Payload: 复制JRE + ldid 签名 ===
      - name: Package Payload (ldid sign + JRE)
        timeout-minutes: 5
        run: gmake payload
      
      # === dSYM 生成 (调试符号 - 对崩溃排查至关重要) ===
      - name: Generate dSYM
        run: gmake dsym
      
      # === 打包 IPA (普通版) ===
      - name: Package IPA
        run: |
          gmake package TROLLSTORE_JIT_ENT=0
          ls -lh artifacts/*.ipa
      
      # === 打包 TIPA (TrollStore 变体 - JIT entitlements) ===
      - name: Package TIPA (TrollStore)
        run: |
          gmake package TROLLSTORE_JIT_ENT=1
          ls -lh artifacts/*.tipa
      
      # === 构建信息 ===
      - name: Build Info
        run: |
          echo "=== 构建产物 ==="
          ls -lh artifacts/
          echo "=== IPA 内容 ==="
          unzip -l artifacts/${{ env.APP_BUNDLE_ID }}-${{ env.APP_VERSION }}-ios.ipa 2>/dev/null | tail -20 || true
          echo "=== TIPA 内容 ==="
          unzip -l artifacts/${{ env.APP_BUNDLE_ID }}-${{ env.APP_VERSION }}-ios-trollstore.tipa 2>/dev/null | tail -20 || true
      
      # === 上传 IPA ===
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_BUNDLE_ID }}-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
      
      # === 上传 TIPA ===
      - name: Upload TIPA (TrollStore)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_BUNDLE_ID }}-tipa
          path: artifacts/*.tipa
          if-no-files-found: error
          retention-days: 14
      
      # === 上传 dSYM ===
      - name: Upload dSYM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dSYM
          path: artifacts/*.dSYM
          if-no-files-found: warn
          retention-days: 30
